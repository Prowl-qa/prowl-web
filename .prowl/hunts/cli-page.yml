name: cli-page
description: Prowl CLI product page renders with key sections and CTAs to docs and GitHub
tags:
  - full

steps:
  - navigate: "/cli"

  - waitForNetworkIdle:
      timeout: 5000

  - assert:
      visible: "Catch regressions before users do"

  - assert:
      visible: "How it works"

  - assert:
      visible: "Built for AI-assisted development"

assertions:
  - selectorExists: "h1"
  - selectorExists: "a[href^='https://docs.prowl.tools']"
  - selectorExists: "a[href='https://github.com/prowl-tools/prowl']"
