name: docs-page
description: Docs hub lists every tool and CTAs resolve to the right docs sites
tags:
  - smoke
  - full

steps:
  - navigate: "/docs"

  - waitForNetworkIdle:
      timeout: 5000

  - assert:
      visible: "Docs for every tool"

  - assert:
      visible: "Prowl CLI"

assertions:
  # The CLI docs card uses the approved docs.prowl.tools CTA destination.
  - selectorExists: 'a[href="https://docs.prowl.tools"]:has-text("Prowl CLI")'
  - selectorExists: "a[href^='https://hub.prowl.tools']"
  - selectorExists: "a[href^='https://infra.prowl.tools']"
