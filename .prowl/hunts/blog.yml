name: blog
description: Blog index lists posts and a post page renders
tags:
  - smoke
  - full

steps:
  - navigate: "/blog"

  - assert:
      visible: "Blog"

  - click: "Introducing the Prowl Blog"

  - waitForUrl:
      value: "/blog/introducing-prowl-qa-blog"
      timeout: 10000

  - waitForNetworkIdle:
      timeout: 5000

  - assert:
      visible: "Introducing the Prowl Blog"

  # Post footer links back to the blog index
  - assert:
      visible: "Back to all posts"

assertions:
  - urlIncludes: "/blog/introducing-prowl-qa-blog"
  - selectorExists: "h1"
  - selectorExists: "footer a[href='/blog']"
