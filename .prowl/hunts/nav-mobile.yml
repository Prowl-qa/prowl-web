name: nav-mobile
description: Mobile hamburger menu opens and lists the site links (run with --viewport mobile)
tags:
  - mobile

steps:
  - navigate: "/"

  - click:
      selector: "button[aria-label='Open menu']"

  - assert:
      visible: "button[aria-label='Close menu']"

  - assert:
      visible: "css=nav.sticky > div[class*='sm:hidden'] a[href='https://docs.prowl.tools']:visible"

  - assert:
      visible: "css=nav.sticky > div[class*='sm:hidden'] a[href='/blog']:visible"

  - click:
      selector: "button[aria-label='Close menu']"

  - assert:
      visible: "button[aria-label='Open menu']"

assertions:
  - noConsoleErrors: true
