name: nav-mobile
description: Mobile hamburger menu opens and lists products and site links (run with --viewport mobile)
tags:
  - mobile

steps:
  - navigate: "/"

  - click:
      selector: "button[aria-label='Open menu']"

  - assert:
      visible: "button[aria-label='Close menu']"

  - assert:
      visible: "Prowl CLI"

  - assert:
      visible: "Prowl Hub"

  - click:
      selector: "button[aria-label='Close menu']"

  - assert:
      visible: "button[aria-label='Open menu']"

assertions:
  - noConsoleErrors: true
