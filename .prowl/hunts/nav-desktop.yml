name: nav-desktop
description: Desktop nav carries the single-product links (How it works, Docs, GitHub), hides the blog, and the How it works anchor lands on the section
tags:
  - smoke
  - full

steps:
  - navigate: "/"

  # No Products menu any more (PQW-025): the nav is a flat set of links.
  - assert:
      notVisible: "css=button[aria-controls='nav-products-menu']"

  - assert:
      visible: "css=nav.sticky a[href='https://docs.prowl.tools']:visible"

  - assert:
      visible: "css=nav.sticky a[href='https://github.com/prowl-tools/prowl']:visible"

  # The blog is hidden while it has no content: no Blog link in the nav.
  - assert:
      notVisible: "css=nav.sticky a[href='/blog']"

  # The anchor link scrolls to the How it works section.
  - click:
      selector: "nav.sticky a[href='/#how-it-works']"

  - waitForUrl:
      value: "#how-it-works"
      timeout: 10000

  - assert:
      visible: "Four steps from install to a hunt running in CI."

assertions:
  - urlIncludes: "#how-it-works"
  - selectorNotExists: "a[href='/blog']"
  - selectorNotExists: "a[href*='hub.prowl.tools']"
  - selectorNotExists: "a[href*='infra.prowl.tools']"
