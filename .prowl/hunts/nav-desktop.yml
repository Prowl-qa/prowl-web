name: nav-desktop
description: Desktop nav Products menu is an accessible disclosure - hover opens it, click toggles aria-expanded, and the Docs link navigates
tags:
  - smoke
  - full

steps:
  - navigate: "/"

  # The trigger is a disclosure button: collapsed on load.
  - assert:
      visible: "css=button[aria-controls='nav-products-menu'][aria-expanded='false']:visible"

  # Mouse users: hovering the trigger opens the menu (pointer UX preserved) and
  # flips aria-expanded to true.
  - hover:
      selector: "button[aria-controls='nav-products-menu']"

  - assert:
      visible: "css=button[aria-controls='nav-products-menu'][aria-expanded='true']:visible"

  # Menu items are revealed and reachable. Scope to the menu region so footer
  # duplicates don't satisfy the check.
  - assert:
      visible: "css=#nav-products-menu a[href='/cli']:visible"

  - assert:
      visible: "css=#nav-products-menu a[href='https://hub.prowl.tools']:visible"

  - assert:
      visible: "css=#nav-products-menu a[href='https://infra.prowl.tools']:visible"

  # Clicking the trigger toggles the disclosure closed again (aria-expanded flips
  # back to false) - proving the JS click handler, not just CSS hover, drives it.
  - click:
      selector: "button[aria-controls='nav-products-menu']"

  - assert:
      visible: "css=button[aria-controls='nav-products-menu'][aria-expanded='false']:visible"

  # Internal nav link actually navigates (client-side routing).
  # Scoped to the sticky top nav so the docs-section "All docs" link doesn't collide.
  - click:
      selector: "nav.sticky a[href='/docs']"

  - waitForUrl:
      value: "/docs"
      timeout: 10000

  - assert:
      visible: "Docs for every tool"

assertions:
  - urlIncludes: "/docs"
  - selectorExists: "a[href='https://github.com/prowl-tools/prowl']"
