name: nav-desktop
description: Desktop nav carries the single-product links (How it works, Docs, Blog, GitHub) and the Blog link navigates
tags:
  - smoke
  - full

steps:
  - navigate: "/"

  # No Products menu any more (PQW-025): the nav is a flat set of links.
  - assert:
      notVisible: "css=button[aria-controls='nav-products-menu']"

  - assert:
      visible: "css=nav.sticky a[href='https://docs.prowl.tools']:visible"

  - assert:
      visible: "css=nav.sticky a[href='https://github.com/prowl-tools/prowl']:visible"

  # Internal nav link actually navigates (client-side routing).
  # Scoped to the sticky top nav so the footer Blog link doesn't collide.
  - click:
      selector: "nav.sticky a[href='/blog']"

  - waitForUrl:
      value: "/blog"
      timeout: 10000

  - assert:
      visible: "css=main h1:has-text('Blog')"

assertions:
  - urlIncludes: "/blog"
  - selectorNotExists: "a[href*='hub.prowl.tools']"
  - selectorNotExists: "a[href*='infra.prowl.tools']"
