# prowl-review config for prowl-web — keyless Codex subscription provider (#64),
# matching the prowl-code-review repo's own dogfood. Every PR is reviewed through
# the ChatGPT login that lives ONLY on the self-hosted Mac mini runner, so
# per-review marginal cost is $0.00 and no provider secret is required or passed
# by the workflow.
# Loaded by the workflows via a trusted base-branch `config-path` (never the PR
# checkout).
provider: codex                # keyless — auth is the runner's own `codex login`
model: gpt-5.5                 # ChatGPT-plan model; failback ladder gpt-5.6-terra -> gpt-5.5
codex:
  effort: low                  # low | medium | high | xhigh — cheap/fast setting
  # lock: true                 # default on: serialize codex runs machine-wide via
                               # $CODEX_HOME/.prowl-review.lock (one auth.json = one stream)

# Claude + Gemini ensemble (#53) is retired now that reviews run on the
# subscription-backed Codex runner (#64). Re-enable it (and restore the
# PROWL_AI_KEY_ANTHROPIC / PROWL_AI_KEY_GEMINI secrets + workflow inputs) to go
# back to API-key reviews, e.g. for a public-runner fallback:
# ensemble:
#   enabled: true
#   providers:
#     - provider: anthropic
#       model: claude-haiku-4-5
#     - provider: gemini
#       model: gemini-2.5-flash

# Fill an empty PR description from the diff; never overwrites a body you wrote.
prDescription:
  enabled: true

# Validate the PR against its linked issue's acceptance criteria; only acts
# when a PR links an issue (e.g. "Closes #12").
issueValidation:
  enabled: true

# Publish the review as a branded "Prowl Review" check run. Completes green
# when no critical findings exist, red when one does — a visual verdict only;
# it never blocks a merge unless marked Required in branch protection.
checkRun:
  enabled: true
  failOn: critical

# Survive sustained provider overload by falling back to an older same-family
# model; only triggers after retries are exhausted on a retryable error.
resilience:
  failback:
    enabled: true
