# prowl-review config for prowl-web — same Claude + Gemini ensemble the
# prowl-code-review repo dogfoods. Workflows prefer the trusted base-branch
# copy and use this PR copy only during the first bootstrap run.
provider: anthropic            # primary — also runs the shared cross-file context pass
model: claude-haiku-4-5
ensemble:
  enabled: true
  providers:
    - provider: anthropic
      model: claude-haiku-4-5
    - provider: gemini
      model: gemini-2.5-flash

# Fill an empty PR description from the diff; never overwrites a body you wrote.
prDescription:
  enabled: true

# Validate the PR against its linked issue's acceptance criteria; only acts
# when a PR links an issue (e.g. "Closes #12").
issueValidation:
  enabled: true

# Publish the review as a branded "Prowl Review" check run. Completes green
# when no critical findings exist, red when one does — a visual verdict only;
# it never blocks a merge unless marked Required in branch protection.
checkRun:
  enabled: true
  failOn: critical

# Survive sustained provider overload by falling back to an older same-family
# model; only triggers after retries are exhausted on a retryable error.
resilience:
  failback:
    enabled: true
